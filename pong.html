<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PONG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
    }
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: none;
    }

    /* Overlay screens */
    .screen-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.88);
      z-index: 10;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .screen-overlay.hidden {
      display: none;
    }
    .screen-overlay h1 {
      font-size: clamp(28px, 7vw, 64px);
      letter-spacing: 10px;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }
    .screen-overlay .subtitle {
      font-size: clamp(11px, 1.6vw, 15px);
      color: #aaa;
      margin-bottom: 18px;
    }

    .btn {
      background: transparent;
      border: 2px solid #fff;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: clamp(12px, 1.8vw, 18px);
      padding: clamp(6px, 1.2vw, 14px) clamp(18px, 4vw, 40px);
      cursor: pointer;
      letter-spacing: 3px;
      transition: all 0.2s;
      margin: 4px;
    }
    .btn:hover {
      background: #fff;
      color: #000;
    }
    .btn-sm {
      font-size: clamp(10px, 1.3vw, 13px);
      padding: clamp(4px, 0.8vw, 8px) clamp(12px, 2vw, 22px);
      letter-spacing: 1px;
    }

    /* Settings styles */
    #settingsScreen {
      justify-content: flex-start;
      overflow-y: auto;
      padding: clamp(16px, 3vw, 40px) clamp(12px, 3vw, 30px);
    }
    #settingsScreen h1 {
      font-size: clamp(24px, 4vw, 40px);
      margin-bottom: 6px;
    }
    #settingsScreen .subtitle {
      margin-bottom: 16px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(6px, 1.2vw, 14px) clamp(16px, 3vw, 36px);
      width: 100%;
      max-width: 680px;
      text-align: left;
      margin-bottom: 16px;
    }
    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .setting-item label {
      font-size: clamp(9px, 1.1vw, 12px);
      color: #aaa;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .setting-item input,
    .setting-item select {
      background: #222;
      border: 1px solid #555;
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: clamp(11px, 1.3vw, 14px);
      padding: clamp(3px, 0.5vw, 6px) 8px;
      outline: none;
      transition: border 0.2s;
    }
    .setting-item input:focus,
    .setting-item select:focus {
      border-color: #fff;
    }
    .setting-item input[type="color"] {
      height: clamp(28px, 3.5vw, 38px);
      padding: 2px;
      cursor: pointer;
    }
    .setting-item input[type="range"] {
      -webkit-appearance: none;
      background: #333;
      height: 4px;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    .setting-item input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }
    .setting-item .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: clamp(8px, 1vw, 11px);
      color: #666;
    }
    .setting-item .range-value {
      font-size: 11px;
      color: #ccc;
      text-align: right;
    }
    .setting-full {
      grid-column: 1 / -1;
    }

    .settings-btns {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #winnerMessage {
      font-size: clamp(24px, 4vw, 40px);
      letter-spacing: 6px;
      margin-bottom: 8px;
    }
    #finalScore {
      font-size: clamp(14px, 2vw, 22px);
      color: #aaa;
      margin-bottom: 12px;
    }

    /* Timer display overlay */
    #timerDisplay {
      position: absolute;
      top: 1.5%;
      left: 50%;
      transform: translateX(-50%);
      color: #666;
      font-size: clamp(12px, 1.6vw, 18px);
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 5;
    }
    #timerDisplay.hidden {
      display: none;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="timerDisplay" class="hidden">--:--</div>

  <!-- ============ MAIN MENU ============ -->
  <div id="mainMenu" class="screen-overlay">
    <h1>PONG</h1>
    <div class="subtitle">Original Arcade Clone</div>
    <div class="controls" style="font-size:clamp(11px,1.4vw,14px); color:#ccc; line-height:2; margin-bottom:16px;">
      <span style="color:#fff; font-weight:bold;">W / S</span> — Left &nbsp;&nbsp;|&nbsp;&nbsp;
      <span style="color:#fff; font-weight:bold;">↑ / ↓</span> — Right<br />
      <span style="color:#fff; font-weight:bold;">P</span> — Pause &nbsp;&nbsp;|&nbsp;&nbsp;
      <span style="color:#fff; font-weight:bold;">Esc</span> — Menu
    </div>
    <button class="btn" id="startBtn">1 PLAYER</button>
    <button class="btn" id="twoPlayerBtn">2 PLAYERS</button>
    <button class="btn btn-sm" id="settingsBtn" style="margin-top:14px;">⚙ SETTINGS</button>
  </div>

  <!-- ============ SETTINGS ============ -->
  <div id="settingsScreen" class="screen-overlay hidden">
    <h1>SETTINGS</h1>
    <div class="subtitle">Customize your game</div>

    <div class="settings-grid">
      <!-- Names -->
      <div class="setting-item">
        <label>Player 1 Name</label>
        <input type="text" id="sPlayer1Name" value="PLAYER 1" maxlength="12" />
      </div>
      <div class="setting-item">
        <label>Player 2 / AI Name</label>
        <input type="text" id="sPlayer2Name" value="COMPUTER" maxlength="12" />
      </div>

      <!-- Colors -->
      <div class="setting-item">
        <label>Paddle 1 Color</label>
        <input type="color" id="sPaddle1Color" value="#ffffff" />
      </div>
      <div class="setting-item">
        <label>Paddle 2 Color</label>
        <input type="color" id="sPaddle2Color" value="#ffffff" />
      </div>

      <div class="setting-item">
        <label>Ball Color</label>
        <input type="color" id="sBallColor" value="#ffffff" />
      </div>
      <div class="setting-item">
        <label>Scoreboard Color</label>
        <input type="color" id="sScoreColor" value="#666666" />
      </div>

      <div class="setting-item">
        <label>Background Brightness</label>
        <input type="range" id="sBgBrightness" min="0" max="50" value="0" />
        <div class="range-labels"><span>Dark</span><span id="sBgBrightnessVal">0</span></div>
      </div>

      <!-- Score & Time -->
      <div class="setting-item">
        <label>Score to Win</label>
        <select id="sScoreLimit">
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="7" selected>7</option>
          <option value="11">11</option>
          <option value="15">15</option>
          <option value="21">21</option>
        </select>
      </div>
      <div class="setting-item">
        <label>Round Time Limit</label>
        <select id="sTimeLimit">
          <option value="0" selected>Off</option>
          <option value="30">30 sec</option>
          <option value="60">1 min</option>
          <option value="90">90 sec</option>
          <option value="120">2 min</option>
          <option value="180">3 min</option>
          <option value="300">5 min</option>
        </select>
      </div>

      <!-- Ball Speed & Paddle Size -->
      <div class="setting-item">
        <label>Ball Speed</label>
        <select id="sBallSpeed">
          <option value="5">Slow</option>
          <option value="6">Medium</option>
          <option value="7" selected>Normal</option>
          <option value="8">Fast</option>
          <option value="9">Very Fast</option>
        </select>
      </div>
      <div class="setting-item">
        <label>Paddle Size</label>
        <select id="sPaddleSize">
          <option value="60">Small</option>
          <option value="80" selected>Normal</option>
          <option value="100">Large</option>
          <option value="130">X-Large</option>
        </select>
      </div>

      <!-- AI Difficulty & Sound -->
      <div class="setting-item">
        <label>AI Difficulty</label>
        <input type="range" id="sAIDifficulty" min="1" max="10" value="5" />
        <div class="range-labels"><span>Easy</span><span id="sAIDiffVal">Normal</span></div>
      </div>
      <div class="setting-item">
        <label>Sound Effects</label>
        <select id="sSound">
          <option value="on" selected>On</option>
          <option value="off">Off</option>
        </select>
      </div>

      <!-- Pause on Score -->
      <div class="setting-item setting-full">
        <label>Pause on Score</label>
        <select id="sPauseOnScore">
          <option value="off" selected>Off</option>
          <option value="on">On</option>
        </select>
      </div>

      <!-- full-width extra controls -->
      <div class="setting-item setting-full">
        <label>Paddle Speed</label>
        <input type="range" id="sPaddleSpeed" min="4" max="12" value="8" />
        <div class="range-labels"><span>Slow</span><span id="sPaddleSpeedVal">Normal</span></div>
      </div>
    </div>

    <div class="settings-btns">
      <button class="btn" id="settingsBackBtn">⬅ BACK</button>
      <button class="btn" id="settingsResetBtn">RESET DEFAULTS</button>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // PONG — Full Game with Settings
  // ============================================================

  const canvas  = document.getElementById('gameCanvas');
  const ctx     = canvas.getContext('2d');
  const mainMenu = document.getElementById('mainMenu');
  const settingsScreen = document.getElementById('settingsScreen');
  const timerDisplay = document.getElementById('timerDisplay');

  // ---------- game coordinate space ----------
  const GAME_W = 800;
  const GAME_H = 500;

  // ---------- helpers ----------
  const rand  = (min, max) => Math.random() * (max - min) + min;
  const clamp = (val, lo, hi) => Math.max(lo, Math.min(hi, val));

  // ---------- settings object ----------
  const defaults = {
    player1Name: 'PLAYER 1',
    player2Name: 'COMPUTER',
    paddle1Color: '#ffffff',
    paddle2Color: '#ffffff',
    ballColor: '#ffffff',
    scoreColor: '#666666',
    bgBrightness: 0,
    scoreLimit: 7,
    timeLimit: 0,
    ballSpeed: 7,
    paddleSize: 80,
    aiDifficulty: 5,
    paddleSpeed: 8,
    sound: 'on',
    pauseOnScore: false,
  };

  const S = { ...defaults };

  const $ = id => document.getElementById(id);

  // ---------- game state ----------
  let twoPlayer  = false;
  let paused     = false;
  let gameOver   = false;
  let roundActive = false;
  let pointMsg   = '';
  let pendingDir = 0;

  // ---------- paddle constants ----------
  const PADDLE_W = 12;
  let PADDLE_H, PADDLE_SPEED;
  let ballSpeed;

  // ---------- ball ----------
  const BALL_SIZE = 10;

  // ---------- objects ----------
  let leftPaddle, rightPaddle, ball;
  let leftScore, rightScore;

  // ---------- timer ----------
  let timeRemaining = 0;
  let timerInterval = null;

  // ---------- sounds ----------
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playBeep(freq, duration, vol) {
    if (S.sound === 'off') return;
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.value = vol || 0.08;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) { /* ignore */ }
  }

  function playPaddleHit()  { playBeep(440, 0.08, 0.07); }
  function playWallBounce() { playBeep(330, 0.06, 0.05); }
  function playScore()      { playBeep(220, 0.2,  0.09); }
  function playWin()        {
    playBeep(523, 0.15, 0.10);
    setTimeout(() => playBeep(659, 0.15, 0.10), 160);
    setTimeout(() => playBeep(784, 0.25, 0.10), 320);
  }

  // ---------- load settings ----------
  function applySettings() {
    PADDLE_H       = parseInt(S.paddleSize);
    PADDLE_SPEED   = parseInt(S.paddleSpeed);
    ballSpeed      = parseInt(S.ballSpeed);
  }

  function loadSettingsFromUI() {
    S.player1Name    = $('sPlayer1Name').value.toUpperCase() || 'PLAYER 1';
    S.player2Name    = $('sPlayer2Name').value.toUpperCase() || 'COMPUTER';
    S.paddle1Color   = $('sPaddle1Color').value;
    S.paddle2Color   = $('sPaddle2Color').value;
    S.ballColor      = $('sBallColor').value;
    S.scoreColor     = $('sScoreColor').value;
    S.bgBrightness   = parseInt($('sBgBrightness').value);
    S.scoreLimit     = parseInt($('sScoreLimit').value);
    S.timeLimit      = parseInt($('sTimeLimit').value);
    S.ballSpeed      = parseInt($('sBallSpeed').value);
    S.paddleSize     = parseInt($('sPaddleSize').value);
    S.aiDifficulty   = parseInt($('sAIDifficulty').value);
    S.paddleSpeed    = parseInt($('sPaddleSpeed').value);
    S.sound          = $('sSound').value;
    S.pauseOnScore   = $('sPauseOnScore').value === 'on';
    applySettings();

    $('sBgBrightnessVal').textContent = S.bgBrightness;
    const diffLabels = ['', 'Easy', 'Easy', 'Easy', 'Normal', 'Normal', 'Normal', 'Hard', 'Hard', 'Hard', 'Insane'];
    $('sAIDiffVal').textContent = diffLabels[S.aiDifficulty] || 'Normal';
    const speedLabels = ['', '', '', '', 'Slow', 'Slow', 'Normal', 'Normal', 'Fast', 'Fast', 'Very Fast', 'Very Fast', 'Insane'];
    $('sPaddleSpeedVal').textContent = speedLabels[S.paddleSpeed] || 'Normal';
  }

  function pushSettingsToUI() {
    $('sPlayer1Name').value   = S.player1Name;
    $('sPlayer2Name').value   = S.player2Name;
    $('sPaddle1Color').value  = S.paddle1Color;
    $('sPaddle2Color').value  = S.paddle2Color;
    $('sBallColor').value     = S.ballColor;
    $('sScoreColor').value    = S.scoreColor;
    $('sBgBrightness').value  = S.bgBrightness;
    $('sScoreLimit').value    = S.scoreLimit;
    $('sTimeLimit').value     = S.timeLimit;
    $('sBallSpeed').value     = S.ballSpeed;
    $('sPaddleSize').value    = S.paddleSize;
    $('sAIDifficulty').value  = S.aiDifficulty;
    $('sPaddleSpeed').value   = S.paddleSpeed;
    $('sSound').value         = S.sound;
    $('sPauseOnScore').value  = S.pauseOnScore ? 'on' : 'off';
    loadSettingsFromUI();
  }

  function resetDefaults() {
    Object.assign(S, defaults);
    pushSettingsToUI();
  }

  // ---------- resize canvas to fill viewport ----------
  let scale = 1;

  function resizeCanvas() {
    const container = document.getElementById('gameContainer');
    const w = container.clientWidth;
    const h = container.clientHeight;
    canvas.width  = w;
    canvas.height = h;
    scale = Math.min(w / GAME_W, h / GAME_H);
  }

  window.addEventListener('resize', resizeCanvas);

  // ---------- reset game ----------
  function resetPaddles() {
    leftPaddle  = { x: 20,            y: GAME_H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, dy: 0 };
    rightPaddle = { x: GAME_W - 20 - PADDLE_W, y: GAME_H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, dy: 0 };
  }

  function resetBall(side) {
    const angle = rand(-0.4, 0.4);
    const dir   = side || (Math.random() < 0.5 ? 1 : -1);
    ball = {
      x: GAME_W / 2 - BALL_SIZE / 2,
      y: GAME_H / 2 - BALL_SIZE / 2,
      s: BALL_SIZE,
      vx: Math.cos(angle) * ballSpeed * dir,
      vy: Math.sin(angle) * ballSpeed,
    };
  }

  function resetBallFrom(dir) {
    // Spawn ball at the scored-on player's paddle heading toward the scorer
    // dir=1  -> spawn at left paddle (heading right)
    // dir=-1 -> spawn at right paddle (heading left)
    const angle = rand(-0.4, 0.4);
    if (dir > 0) {
      ball = {
        x: leftPaddle.x + leftPaddle.w + 1,
        y: leftPaddle.y + leftPaddle.h / 2 - BALL_SIZE / 2,
        s: BALL_SIZE,
        vx: Math.cos(angle) * ballSpeed * dir,
        vy: Math.sin(angle) * ballSpeed,
      };
    } else {
      ball = {
        x: rightPaddle.x - BALL_SIZE - 1,
        y: rightPaddle.y + rightPaddle.h / 2 - BALL_SIZE / 2,
        s: BALL_SIZE,
        vx: Math.cos(angle) * ballSpeed * dir,
        vy: Math.sin(angle) * ballSpeed,
      };
    }
  }

  function resetGame() {
    stopTimer();
    leftScore  = 0;
    rightScore = 0;
    gameOver   = false;
    paused     = false;
    roundActive = false;
    pointMsg   = '';
    pendingDir = 0;
    applySettings();
    resetPaddles();
    resetBall(1);

    if (S.timeLimit > 0) {
      timeRemaining = S.timeLimit;
      timerDisplay.classList.remove('hidden');
      updateTimerDisplay();
      startTimer();
    } else {
      timerDisplay.classList.add('hidden');
      timeRemaining = 0;
    }
    roundActive = true;
  }

  // ---------- timer ----------
  function startTimer() {
    stopTimer();
    timerInterval = setInterval(() => {
      if (paused || gameOver) return;
      timeRemaining--;
      updateTimerDisplay();
      if (timeRemaining <= 0) {
        timeRemaining = 0;
        updateTimerDisplay();
        gameOver = true;
        stopTimer();
        showWinner(true);
      }
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  function updateTimerDisplay() {
    const m = Math.floor(timeRemaining / 60);
    const s = timeRemaining % 60;
    timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  // ---------- keys ----------
  const keys = {};
  function clearKeys() {
    for (const k in keys) keys[k] = false;
  }
  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'p' || e.key === 'P') {
      if (!gameOver) {
        if (pointMsg) {
          // Resuming from "Point X" pause: reset ball and continue
          resetBallFrom(pendingDir);
          pointMsg = '';
          pendingDir = 0;
          paused = false;
        } else {
          paused = !paused;
        }
      }
    }
    if (e.key === ' ') e.preventDefault();
    if (e.key === 'Escape') showMainMenu();
  });
  document.addEventListener('keyup', e => { keys[e.key] = false; });
  // Clear keys when window loses focus to prevent stuck keys
  window.addEventListener('blur', clearKeys);

  // ---------- AI ----------
  function moveAI() {
    const paddle = rightPaddle;
    const target = ball.y + ball.s / 2 - paddle.h / 2;
    const diff   = target - paddle.y;

    const maxSpeed = 1.5 + (S.aiDifficulty / 10) * 5;
    const reaction = 4 + (S.aiDifficulty / 10) * 16;

    if (Math.abs(diff) > reaction) {
      paddle.dy = Math.sign(diff) * maxSpeed;
    } else {
      paddle.dy = 0;
    }
    if (Math.random() < 0.02 - (S.aiDifficulty / 10) * 0.015) paddle.dy = 0;
  }

  // ---------- update (in game coords) ----------
  function update() {
    if (paused || gameOver || !roundActive) return;

    if (!twoPlayer) moveAI();

    if (keys['w'] || keys['W']) leftPaddle.dy = -PADDLE_SPEED;
    else if (keys['s'] || keys['S']) leftPaddle.dy = PADDLE_SPEED;
    else leftPaddle.dy = 0;

    if (twoPlayer) {
      if (keys['ArrowUp'])    rightPaddle.dy = -PADDLE_SPEED;
      else if (keys['ArrowDown']) rightPaddle.dy = PADDLE_SPEED;
      else rightPaddle.dy = 0;
    }

    leftPaddle.y  = clamp(leftPaddle.y  + leftPaddle.dy,  0, GAME_H - leftPaddle.h);
    rightPaddle.y = clamp(rightPaddle.y + rightPaddle.dy, 0, GAME_H - rightPaddle.h);

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y <= 0) { ball.y = 0;  ball.vy = -ball.vy; playWallBounce(); }
    if (ball.y + ball.s >= GAME_H) { ball.y = GAME_H - ball.s; ball.vy = -ball.vy; playWallBounce(); }

    const bLeft   = ball.x;
    const bRight  = ball.x + ball.s;
    const bTop    = ball.y;
    const bBottom = ball.y + ball.s;

    // left paddle
    if (bLeft <= leftPaddle.x + leftPaddle.w &&
        bRight >= leftPaddle.x &&
        bBottom >= leftPaddle.y &&
        bTop   <= leftPaddle.y + leftPaddle.h &&
        ball.vx < 0) {
      const hitPos = (ball.y + ball.s / 2 - leftPaddle.y) / leftPaddle.h;
      const angle  = (hitPos - 0.5) * 1.2;
      ball.vx = Math.abs(Math.cos(angle) * ballSpeed);
      ball.vy = Math.sin(angle) * ballSpeed;
      ball.x  = leftPaddle.x + leftPaddle.w;
      playPaddleHit();
    }

    // right paddle
    if (bLeft <= rightPaddle.x + rightPaddle.w &&
        bRight >= rightPaddle.x &&
        bBottom >= rightPaddle.y &&
        bTop   <= rightPaddle.y + rightPaddle.h &&
        ball.vx > 0) {
      const hitPos = (ball.y + ball.s / 2 - rightPaddle.y) / rightPaddle.h;
      const angle  = (hitPos - 0.5) * 1.2;
      ball.vx = -Math.abs(Math.cos(angle) * ballSpeed);
      ball.vy = Math.sin(angle) * ballSpeed;
      ball.x  = rightPaddle.x - ball.s;
      playPaddleHit();
    }

    if (ball.x + ball.s < 0) {
      rightScore++; playScore();
      if (S.pauseOnScore && rightScore < S.scoreLimit) {
        pointMsg = 'POINT ' + (twoPlayer ? S.player2Name : 'COMPUTER');
        pendingDir = -1;
        paused = true;
      }
      checkWin();
      if (!gameOver && !pointMsg) resetBallFrom(-1);
    }
    if (ball.x > GAME_W) {
      leftScore++; playScore();
      if (S.pauseOnScore && leftScore < S.scoreLimit) {
        pointMsg = 'POINT ' + S.player1Name;
        pendingDir = 1;
        paused = true;
      }
      checkWin();
      if (!gameOver && !pointMsg) resetBallFrom(1);
    }
  }

  function checkWin() {
    if (leftScore >= S.scoreLimit || rightScore >= S.scoreLimit) {
      gameOver = true;
      stopTimer();
      pointMsg = '';
      pendingDir = 0;
      showWinner(false);
    }
  }

  function showWinner(timeUp) {
    playWin();
    let winner;
    if (timeUp) {
      if (leftScore > rightScore) winner = S.player1Name;
      else if (rightScore > leftScore) winner = twoPlayer ? S.player2Name : 'COMPUTER';
      else winner = 'TIE — NO ONE';
    } else {
      if (leftScore >= S.scoreLimit) winner = S.player1Name;
      else winner = twoPlayer ? S.player2Name : 'COMPUTER';
    }
    const msg = timeUp ? 'TIME UP!' : 'GAME OVER';
    const scoreText = timeUp && leftScore === rightScore ? `${leftScore} — ${rightScore} (TIE!)` : `${leftScore} — ${rightScore}`;

    mainMenu.querySelector('h1').textContent = msg;
    mainMenu.querySelector('.subtitle').textContent = '';
    mainMenu.querySelector('.controls').innerHTML =
      `<div id="winnerMessage">${winner} WINS!</div>
       <div id="finalScore">${scoreText}</div>`;
    $('startBtn').textContent = 'PLAY AGAIN';
    $('twoPlayerBtn').style.display = 'none';
    $('settingsBtn').style.display = 'none';
    mainMenu.classList.remove('hidden');
    paused = true;
  }

  // ---------- draw (scaled to fill screen) ----------
  function draw() {
    const actualW = canvas.width;
    const actualH = canvas.height;

    // Clear entire canvas
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, actualW, actualH);

    // Save and scale to game coordinate space
    ctx.save();
    const sx = actualW / GAME_W;
    const sy = actualH / GAME_H;
    ctx.scale(sx, sy);

    // background brightness on top
    if (S.bgBrightness > 0) {
      ctx.fillStyle = `rgba(${S.bgBrightness},${S.bgBrightness},${S.bgBrightness},${S.bgBrightness / 60})`;
      ctx.fillRect(0, 0, GAME_W, GAME_H);
    }

    // center line
    ctx.strokeStyle = '#333';
    ctx.lineWidth   = 2;
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(GAME_W / 2, 0);
    ctx.lineTo(GAME_W / 2, GAME_H);
    ctx.stroke();
    ctx.setLineDash([]);

    // paddles
    ctx.fillStyle = S.paddle1Color;
    ctx.fillRect(leftPaddle.x,  leftPaddle.y,  leftPaddle.w,  leftPaddle.h);
    ctx.fillStyle = S.paddle2Color;
    ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.w, rightPaddle.h);

    // ball
    ctx.fillStyle = S.ballColor;
    ctx.fillRect(ball.x, ball.y, ball.s, ball.s);

    // scores
    ctx.font      = '48px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = S.scoreColor;
    ctx.fillText(leftScore,  GAME_W / 2 - 60, 10);
    ctx.fillText(rightScore, GAME_W / 2 + 60, 10);

    // player names under scores
    ctx.font      = '11px "Courier New", monospace';
    ctx.fillStyle = S.scoreColor;
    ctx.globalAlpha = 0.7;
    ctx.fillText(S.player1Name, GAME_W / 2 - 60, 62);
    ctx.fillText(twoPlayer ? S.player2Name : 'CPU', GAME_W / 2 + 60, 62);
    ctx.globalAlpha = 1;

    // pause overlay — show point message or generic pause
    if (paused && !gameOver && roundActive) {
      if (pointMsg) {
        ctx.font      = '24px "Courier New", monospace';
        ctx.fillStyle = 'rgb(255,255,100)';
        ctx.textAlign = 'center';
        ctx.fillText(pointMsg, GAME_W / 2, GAME_H / 2 - 30);
        ctx.font      = '14px "Courier New", monospace';
        ctx.fillStyle = 'rgb(200,200,200)';
        ctx.fillText('PRESS P TO RESUME', GAME_W / 2, GAME_H / 2 + 10);
      } else {
        ctx.font      = '20px "Courier New", monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.textAlign = 'center';
        ctx.fillText('— PAUSED —', GAME_W / 2, GAME_H / 2 - 20);
      }
    }

    // timer on canvas
    if (S.timeLimit > 0 && roundActive && !gameOver) {
      ctx.font      = '12px "Courier New", monospace';
      ctx.fillStyle = S.scoreColor;
      ctx.globalAlpha = 0.5;
      ctx.textAlign = 'center';
      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      ctx.fillText(`${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`, GAME_W / 2, GAME_H - 16);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  // ---------- game loop ----------
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- show/hide screens ----------
  function showMainMenu() {
    stopTimer();
    paused = true;
    roundActive = false;
    gameOver = false;
    pointMsg = '';
    pendingDir = 0;
    mainMenu.querySelector('h1').textContent = 'PONG';
    mainMenu.querySelector('.subtitle').textContent = 'Original Arcade Clone';
    mainMenu.querySelector('.controls').innerHTML =
      `<span style="color:#fff; font-weight:bold;">W / S</span> — Left &nbsp;&nbsp;|&nbsp;&nbsp;
       <span style="color:#fff; font-weight:bold;">↑ / ↓</span> — Right<br />
       <span style="color:#fff; font-weight:bold;">P</span> — Pause &nbsp;&nbsp;|&nbsp;&nbsp;
       <span style="color:#fff; font-weight:bold;">Esc</span> — Menu`;
    $('startBtn').textContent = '1 PLAYER';
    $('twoPlayerBtn').style.display = 'inline-block';
    $('settingsBtn').style.display = 'inline-block';
    mainMenu.classList.remove('hidden');
    settingsScreen.classList.add('hidden');
  }

  function startGame(onePlayer) {
    twoPlayer = !onePlayer;
    clearKeys();
    loadSettingsFromUI();
    resetGame();
    mainMenu.classList.add('hidden');
    settingsScreen.classList.add('hidden');
  }

  // ---------- event listeners ----------
  $('startBtn').addEventListener('click', () => startGame(true));
  $('twoPlayerBtn').addEventListener('click', () => startGame(false));

  $('settingsBtn').addEventListener('click', () => {
    pushSettingsToUI();
    mainMenu.classList.add('hidden');
    settingsScreen.classList.remove('hidden');
  });

  $('settingsBackBtn').addEventListener('click', () => {
    loadSettingsFromUI();
    settingsScreen.classList.add('hidden');
    mainMenu.classList.remove('hidden');
  });

  $('settingsResetBtn').addEventListener('click', resetDefaults);

  // Live preview for color/brightness/range changes
  $('sPaddle1Color').addEventListener('input', () => S.paddle1Color = $('sPaddle1Color').value);
  $('sPaddle2Color').addEventListener('input', () => S.paddle2Color = $('sPaddle2Color').value);
  $('sBallColor').addEventListener('input', () => S.ballColor = $('sBallColor').value);
  $('sScoreColor').addEventListener('input', () => S.scoreColor = $('sScoreColor').value);
  $('sBgBrightness').addEventListener('input', () => {
    S.bgBrightness = parseInt($('sBgBrightness').value);
    $('sBgBrightnessVal').textContent = S.bgBrightness;
  });
  $('sAIDifficulty').addEventListener('input', () => {
    const v = parseInt($('sAIDifficulty').value);
    const labels = ['', 'Easy', 'Easy', 'Easy', 'Normal', 'Normal', 'Normal', 'Hard', 'Hard', 'Hard', 'Insane'];
    $('sAIDiffVal').textContent = labels[v] || 'Normal';
  });
  $('sPaddleSpeed').addEventListener('input', () => {
    const v = parseInt($('sPaddleSpeed').value);
    const labels = ['', '', '', '', 'Slow', 'Slow', 'Normal', 'Normal', 'Fast', 'Fast', 'Very Fast', 'Very Fast', 'Insane'];
    $('sPaddleSpeedVal').textContent = labels[v] || 'Normal';
  });

  $('sPaddleSpeed').addEventListener('change', () => {
    S.paddleSpeed = parseInt($('sPaddleSpeed').value);
    if (roundActive && !gameOver) PADDLE_SPEED = S.paddleSpeed;
  });
  $('sBallSpeed').addEventListener('change', () => {
    S.ballSpeed = parseInt($('sBallSpeed').value);
    if (roundActive && !gameOver) {
      ballSpeed = S.ballSpeed;
      const curSpd = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      if (curSpd > 0) {
        const ratio = ballSpeed / curSpd;
        ball.vx *= ratio;
        ball.vy *= ratio;
      }
    }
  });

  // ---------- init ----------
  applySettings();
  resizeCanvas();
  resetPaddles();
  resetBall(1);
  mainMenu.classList.remove('hidden');
  loop();
</script>

</body>
</html>
